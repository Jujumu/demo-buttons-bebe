<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign in · Buttons Bebe Support</title>
<style>
:root{color-scheme:light;--ink:#1c1c1c;--muted:#66665f;--paper:#e8e5d8;--card:rgba(255,255,255,.62);--lime:#e7f65e;--orange:#f9a16c;--red:#8e2b20}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{width:min(100%,440px)}.brand{display:flex;align-items:center;gap:12px;margin:0 0 28px 8px;font-size:16px;font-weight:700}.mark{display:grid;place-items:center;width:34px;height:34px;background:var(--ink);color:var(--lime);font-size:17px;font-weight:800;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 66%,43% 50%,0 34%)}
.card{padding:36px;border:1px solid rgba(255,255,255,.7);border-radius:32px;background:var(--card);box-shadow:0 24px 70px rgba(45,42,29,.1);backdrop-filter:blur(18px)}h1{margin:0;font-size:32px;line-height:1.1;font-weight:500;letter-spacing:-.04em} .intro{margin:10px 0 28px;color:var(--muted);font-size:14px;line-height:1.5}
label{display:block;margin:18px 0 7px;font-size:12px;font-weight:700}input{width:100%;padding:13px 14px;border:1px solid rgba(28,28,28,.16);border-radius:13px;background:rgba(255,255,255,.7);color:var(--ink);font:inherit;font-size:15px;outline:none}input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(231,246,94,.8)}button{width:100%;margin-top:24px;padding:14px 18px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}button:hover{background:#3a3932}button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;margin-top:16px;color:var(--red);font-size:13px;line-height:1.4}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:520px){body{padding:16px}.card{padding:28px 22px;border-radius:24px}.brand{margin-left:2px}}
</style>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="support-theme">
/* Buttons Bebe support design: one palette, type scale and control language. */
:root {
  color-scheme: light;
  --ground: #F4F0EA; --surface: #FFFDF9; --ink: #1C1916;
  --mute: #5C564F; --line: rgba(28,25,22,.12); --accent: #B5471D;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --radius-sm: 4px; --radius: 6px; --radius-lg: 8px;
  --acc: var(--ink); --acc-soft: #EEE4DC; --ink2: var(--mute); --ink3: #746C63;
  --bg: var(--ground); --card: var(--surface); --paper: var(--ground); --muted: var(--mute);
  --green: #2F6B3A; --green-s: #E6EFE4; --amber: #8A6118; --amber-s: #F5EBDD;
  --red: #A43C29; --red-s: #F5E5DF;
}
body { background:var(--ground); color:var(--ink); font-family:var(--sans); font-variant-numeric:tabular-nums; }
button,input,textarea,select { font-family:inherit; }
a { color:var(--accent); }
button,a,input,textarea,select { transition:background-color 120ms ease,border-color 120ms ease; }
:where(button,a,input,textarea,select):focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
button:disabled { cursor:default; }
.support-nav { height:52px; display:flex; align-items:center; gap:24px; padding:0 20px; border-bottom:1px solid var(--line); background:var(--surface); }
.support-nav .support-brand { color:var(--ink); font-size:14px; font-weight:600; text-decoration:none; margin-right:auto; }
.support-nav a { font-size:13px; color:var(--mute); text-decoration:none; padding:6px 0; }
.support-nav a[aria-current=page] { color:var(--ink); box-shadow:0 2px var(--accent); }
.support-nav .lock-label { font-size:12px; color:var(--mute); }
body[data-support-page=inbox] #inbox-root { height:calc(100dvh - 52px); }
.empty-pane { padding:28px 20px; color:var(--mute); font-size:13px; line-height:1.6; }
.empty-pane strong { display:block; color:var(--ink); font-weight:500; margin-bottom:6px; }
.empty-pane p { margin-bottom:14px; }
/* Console keeps every existing view and action. */
body[data-support-page=console] #app { height:100dvh; padding:8px; gap:8px; overflow:hidden; }
body[data-support-page=console] .side { width:224px; flex:0 0 224px; height:100%; min-height:0; padding:20px 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
body[data-support-page=console] .main { min-width:0; height:100%; overflow:hidden; background:var(--ground); }
body[data-support-page=console] .top { padding:20px 24px; min-height:86px; background:var(--ground); border-bottom:1px solid var(--line); }
body[data-support-page=console] .top h1 { font-size:26px; line-height:1.25; font-weight:500; letter-spacing:-.025em; }
body[data-support-page=console] .top .sub { font-size:13px; color:var(--mute); margin-top:5px; }
body[data-support-page=console] .wrap { padding:24px; overflow:auto; }
body[data-support-page=console] .logo { margin-bottom:24px; }
body[data-support-page=console] .logo .mark { border-radius:6px; background:var(--ink); color:var(--surface); }
body[data-support-page=console] .logo .tag { background:transparent; color:var(--mute); }
body[data-support-page=console] .nav a { border-radius:6px; font-size:13px; min-height:38px; text-decoration:none; }
body[data-support-page=console] .nav a:hover { background:var(--ground); }
body[data-support-page=console] .nav a.on { background:var(--acc-soft); box-shadow:inset 3px 0 var(--accent); }
body[data-support-page=console] :is(.kpi,.panel,.tk,.conn,.kblist,.kbed) { border:1px solid var(--line); border-radius:8px; background:var(--surface); box-shadow:none; backdrop-filter:none; }
body[data-support-page=console] .kpis { gap:12px; }
body[data-support-page=console] .kpi { padding:18px; }
body[data-support-page=console] .kpi .v { font-size:30px; font-weight:500; letter-spacing:-.025em; }
body[data-support-page=console] .kpi .l { font-size:12px; color:var(--mute); }
body[data-support-page=console] .panel { padding:22px; }
body[data-support-page=console] .panel h3 { font-size:16px; font-weight:500; }
body[data-support-page=console] :is(.btn,.chip,.badge,.pill,.chips span,.conn .stt,.live) { border-radius:6px; }
body[data-support-page=console] .btn { min-height:34px; font-size:13px; }
body[data-support-page=console] :is(.btn.p,.btn.send,.chip.on) { background:var(--ink); border-color:var(--ink); color:var(--surface); }
body[data-support-page=console] :is(.btn.p,.btn.send):hover { background:#39332D; }
body[data-support-page=console] :is(.detail,.lstat,.tk .row.open,.tk .row:hover,.conn .ic,.chips span,.pill,.side .store .av) { background:var(--ground); }
body[data-support-page=console] :is(.detail .msg,.dedit,.editbox) { background:var(--surface); border-radius:6px; }
body[data-support-page=console] .head-icon,body[data-support-page=console] .head-avatar { background:var(--surface); border:1px solid var(--line); border-radius:6px; }
body[data-support-page=console] .menu-btn { border-radius:6px; }
/* Same controls and surfaces at sign-in. */
body[data-support-page=login] .card { border:1px solid var(--line); border-radius:8px; padding:32px; background:var(--surface); box-shadow:0 8px 28px rgba(28,25,22,.04); backdrop-filter:none; }
body[data-support-page=login] .mark { clip-path:none; border-radius:6px; color:var(--surface); }
body[data-support-page=login] h1 { font-size:28px; font-weight:500; letter-spacing:-.025em; }
body[data-support-page=login] input { border:1px solid var(--line); border-radius:6px; background:var(--surface); }
body[data-support-page=login] input:focus { border-color:var(--accent); box-shadow:0 0 0 2px #EEE4DC; }
body[data-support-page=login] button { border-radius:6px; font-weight:500; }
@media(max-width:900px) {
 body[data-support-page=console] .side { display:flex; position:fixed; z-index:50; left:8px; top:8px; height:calc(100dvh - 16px); transform:translateX(calc(-100% - 16px)); transition:transform 160ms ease; }
 body[data-support-page=console] .side.open { transform:translateX(0); }
 body[data-support-page=console] .menu-btn { display:grid; place-items:center; width:36px; height:36px; }
 body[data-support-page=console] .nav-scrim.open { display:block; position:fixed; inset:0; z-index:40; border:0; background:rgba(28,25,22,.25); }
 body[data-support-page=console] .top { padding:16px; gap:12px; }
 body[data-support-page=console] .wrap { padding:16px; }
 .support-nav { gap:16px; padding:0 12px; }
 .support-nav .lock-label { display:none; }
}
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; animation:none!important; } }
body[data-support-page=console] .nav-scrim { display:none; }
body[data-support-page=console] .menu-btn { display:none; }
body[data-support-page=console] .header-actions { display:flex; align-items:center; gap:8px; }
body[data-support-page=console] .head-icon,body[data-support-page=console] .head-avatar { display:grid; place-items:center; width:34px; height:34px; padding:7px; cursor:pointer; }
body[data-support-page=console] .head-icon svg { width:17px; height:17px; }
body[data-support-page=console] .freshness { font-size:11px; color:var(--mute); }
body[data-support-page=console] .error-banner { border-radius:8px; }
@media(max-width:900px) {
 body[data-support-page=console] .menu-btn { display:grid; }
 body[data-support-page=console] .nav-scrim.open { display:block; }
}
body[data-support-page=console] .head-logout { padding:7px 11px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); font-size:12px; cursor:pointer; }
body[data-support-page=console] .head-icon { position:relative; }
body[data-support-page=console] :is(.notice-intro,.notice-form,.notice-review,.notice-card,.attention,.notification-row,.notification-head) { border-radius:8px; box-shadow:none; }
body[data-support-page=console] :is(.notice-intro,.notice-form,.notice-review,.notice-card) { background:var(--surface); border-color:var(--line); }
body[data-support-page=console] :is(.notice-duration,.notice-duration-card,.attention-btn,.notification-kind) { border-radius:6px; }
body[data-support-page=console] .t-badge-dot { background:var(--accent); }
@media(max-width:600px) {
 body[data-support-page=console] .top { flex-wrap:wrap; }
 body[data-support-page=console] .header-actions { gap:6px; margin-left:auto; }
 body[data-support-page=console] .top h1 { font-size:22px; }
 body[data-support-page=console] .top .sub { max-width:52vw; font-size:12px; }
 body[data-support-page=console] .live { font-size:11px; padding:5px 7px; }
 body[data-support-page=console] .head-avatar { display:none; }
}

@media(min-width:601px) and (max-width:1000px) { body[data-support-page=console] .kpis { grid-template-columns:repeat(3,minmax(0,1fr)); } }
</style>
</head>
<body data-support-page="login">
<main class="shell">
  <div class="brand"><span class="mark" aria-hidden="true">B</span><span>Buttons Bebe Support</span></div>
  <section class="card" aria-labelledby="title">
    <h1 id="title">Welcome back</h1>
    <p class="intro">Sign in to review your AI support drafts and live store activity.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Sign in</button>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
  </section>
</main>
<script>
const form=document.getElementById("login-form"),user=document.getElementById("username"),pass=document.getElementById("password"),submit=document.getElementById("submit"),error=document.getElementById("error");
const nextPath=()=>{const value=new URLSearchParams(location.search).get("next")||"/console/";try{const decoded=decodeURIComponent(value);const url=new URL(decoded,location.origin);if(/[\\\x00-\x1f\x7f%]/.test(decoded)||url.origin!==location.origin||decoded.startsWith("//"))return "/console/";return (url.pathname==="/console"||url.pathname.startsWith("/console/")||url.pathname==="/inbox"||url.pathname.startsWith("/inbox/"))?url.pathname+url.search+url.hash:"/console/";}catch{return "/console/";}};
const showError=(message)=>{error.textContent=message;};
fetch("/console/api/auth/session",{credentials:"same-origin",cache:"no-store"}).then(response=>{if(response.ok)location.replace(nextPath());}).catch(()=>{});
form.addEventListener("submit",async(event)=>{event.preventDefault();showError("");submit.disabled=true;submit.textContent="Signing in…";try{const response=await fetch("/console/api/auth/login",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({username:user.value,password:pass.value,next:nextPath()})});let body={};try{body=await response.json();}catch(_){}if(!response.ok){showError(response.status===429?"Too many attempts. Please wait a minute and try again.":response.status===503?"Sign-in is temporarily unavailable. Please contact the owner.":"The username or password is not correct.");submit.disabled=false;submit.textContent="Sign in";pass.select();return;}location.replace(body.redirect||"/console/");}catch(_){showError("Could not reach the sign-in service. Please try again.");submit.disabled=false;submit.textContent="Sign in";}});
</script>
</body>
</html>
