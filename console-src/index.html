<html lang="en">

<title>Buttons Bebe — Support Console</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--acc:#1c1c1c;--acc-soft:rgba(255,255,255,.5);--ink:#1c1c1c;--ink2:#5c5952;--ink3:#817d73;--bg:#e8e5d8;--card:rgba(255,255,255,.42);--line:rgba(28,28,28,.09);--green:#237a4b;--green-s:#dff1aa;--amber:#b56a2f;--amber-s:#f9d4ad;--red:#b74339;--red-s:#f4c8be;--radius:28px;font-family:Inter,"Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif}
body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
#app{display:flex;min-height:100vh}
.side{width:230px;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;flex:0 0 230px}
.logo{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;flex-wrap:wrap}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px}
.logo b{font-size:16px;font-weight:600}.logo .tag{font-size:10px;color:var(--acc);background:var(--acc-soft);padding:2px 6px;border-radius:20px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--ink2);font-size:14px;cursor:pointer;font-weight:500}
.nav a:hover{background:#f4f5f9}.nav a.on{background:var(--acc-soft);color:var(--acc)}
.nav a svg{width:18px;height:18px;flex:0 0 18px}
.side .store{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:10px}
.side .store .av{width:32px;height:32px;border-radius:8px;background:#eef0f6;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink2)}
.side .store .nm{font-size:13px;font-weight:600}.side .store .pl{font-size:11px;color:var(--ink3)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 26px;border-bottom:1px solid var(--line);background:var(--card)}
.top h1{font-size:19px;font-weight:600}.top .sub{font-size:13px;color:var(--ink3);margin-top:2px}
.live{display:flex;align-items:center;gap:7px;font-size:13px;background:var(--green-s);color:#0a7a48;padding:6px 11px;border-radius:20px;font-weight:500;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.wrap{padding:22px 26px;overflow:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi .l{font-size:12px;color:var(--ink3);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.kpi .v{font-size:28px;font-weight:600;margin:8px 0 4px}
.kpi .s{font-size:12.5px;color:var(--ink2)}.kpi .s.up{color:#0a7a48}.kpi .s.dn{color:var(--red)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.side{display:none}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.panel h3{font-size:15px;font-weight:600;margin-bottom:2px}.panel .ph{font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.hb{display:flex;flex-direction:column;gap:11px;padding-top:4px}
.hb .r{display:flex;align-items:center;gap:12px;font-size:13px}
.hb .r .lab{width:78px;flex:0 0 78px;color:var(--ink2)}
.hb .r .track{flex:1;height:10px;background:#f1f2f7;border-radius:6px;overflow:hidden}
.hb .r .fill{height:100%;border-radius:6px}
.hb .r .n{width:26px;text-align:right;color:var(--ink2);font-weight:600}
.act{display:flex;flex-direction:column;gap:12px}
.act .r{display:flex;gap:11px;align-items:flex-start;font-size:13.5px}
.act .r .ic{width:26px;height:26px;border-radius:7px;flex:0 0 26px;display:flex;align-items:center;justify-content:center}
.act .r .ic.g{background:var(--green-s);color:#0a7a48}.act .r .ic.a{background:var(--amber-s);color:var(--amber);font-weight:700}
.act .r .ic svg{width:15px;height:15px}
.act .r .tm{color:var(--ink3);font-size:12px;margin-left:auto;white-space:nowrap}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{font-size:13px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tk{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tk .row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer}
.tk .row:first-child{border-top:none}.tk .row:hover{background:#fafbfd}
.tk .who{width:170px;flex:0 0 170px;min-width:0}
.tk .who b{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .who small{font-size:12px;color:var(--ink3)}
.tk .subj{flex:1;min-width:0;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge.low{background:var(--green-s);color:#0a7a48}.badge.sens{background:var(--amber-s);color:var(--amber)}
.st{font-size:12px;color:var(--ink3);width:100px;text-align:right;flex:0 0 100px}
.st b{color:var(--ink2);font-weight:600}
.detail{padding:8px 26px 24px;border-top:1px solid var(--line);background:#fafbfd}
.detail .dwrap{max-width:840px}
.detail .lab{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#667085;font-weight:700;margin:0 0 7px}
.detail .lab.lab2{margin-top:18px}
.detail .msg{font-size:13.5px;color:var(--ink);line-height:1.62;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.linkbtn{background:none;border:none;color:var(--acc);font-size:12.5px;font-weight:600;cursor:pointer;padding:8px 0 0}
.pill{font-size:10px;font-weight:700;letter-spacing:.4px;background:#eef0f6;color:var(--ink2);padding:2px 7px;border-radius:20px;margin-left:4px;vertical-align:1px}
.sendhint{font-size:11.5px;color:var(--ink3);text-align:right;margin-top:7px}
.detail .draft{font-size:13.5px;color:var(--ink);line-height:1.65;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;white-space:pre-wrap}
.detail .draft.esc{background:var(--amber-s);border-color:#f3dfb0;color:#7a5406}
.warn{background:var(--amber-s);color:#7a5406;border:1px solid #f3dfb0;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:8px;font-weight:500}
.dedit{width:100%;min-height:160px;font-family:inherit;font-size:13.5px;line-height:1.6;border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--ink);background:#fff;resize:vertical}
.actbar{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.actbar .toast{margin-right:auto;color:var(--ink2)}
.editbox{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px}
.editact{display:flex;gap:8px;margin-top:8px}
.btn.send{background:var(--green);border-color:var(--green);color:#fff}.btn.send:hover{background:#0ea25c}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}.btn.ghost:hover{background:#eef0f6;border-color:transparent}
.tk .row.open{background:#fafbfd}
.lrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-top:6px}
.lstat{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.lstat .v{font-size:24px;font-weight:600}.lstat .l{font-size:12px;color:var(--ink3);margin-top:2px}
.conns{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.conn{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.conn .h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.conn .ic{width:38px;height:38px;border-radius:10px;background:#f1f2f7;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink2);font-size:14px;flex:0 0 38px}
.conn .h b{font-size:14.5px;font-weight:600;display:block}.conn .h small{font-size:12px;color:var(--ink3)}
.conn .stt{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#0a7a48;background:var(--green-s);padding:5px 10px;border-radius:20px;font-weight:600;margin-top:2px}
.conn .dt{font-size:13px;color:var(--ink2);margin-top:10px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
.step:first-child{border-top:none}
.step .ck{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.step .ck svg{width:14px;height:14px}.step b{font-weight:600}.step small{color:var(--ink3);font-size:12.5px;display:block}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;max-width:520px}
.sw{width:42px;height:24px;border-radius:20px;background:#d6dae4;position:relative;cursor:pointer;flex:0 0 42px}
.sw.on{background:var(--acc)}.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}.sw.on i{left:21px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{font-size:12.5px;background:#f1f2f7;color:var(--ink2);padding:5px 11px;border-radius:20px;font-weight:500}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-weight:600;margin:26px 0 12px}
.hint{font-size:12px;color:var(--ink3)}
.empty{padding:26px;color:var(--ink3);font-size:14px;text-align:center}
.rixbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.kbwrap{display:grid;grid-template-columns:250px 1fr;gap:16px}
@media(max-width:820px){.kbwrap{grid-template-columns:1fr}}
.kblist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px;max-height:72vh;overflow:auto}
.kbgroup{margin-bottom:4px}
.kbgroup .gh{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink3);font-weight:600;padding:9px 8px 4px;display:flex;justify-content:space-between;align-items:center}
.kbgroup .gh button{font-size:11px;color:var(--acc);background:none;border:none;cursor:pointer;font-weight:600;padding:0}
.kbitem{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:7px;font-size:13px;color:var(--ink2);cursor:pointer;border:none;background:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbitem:hover{background:#f4f5f9}.kbitem.on{background:var(--acc-soft);color:var(--acc);font-weight:500}
.kbed{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;min-height:60vh}
.kbed .eh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.kbed .eh b{font-size:13px;color:var(--ink2);font-family:ui-monospace,Menlo,monospace}
.kbed .ef{display:flex;align-items:center;gap:12px}
.kbed textarea{width:100%;flex:1;min-height:50vh;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.55;border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--ink);resize:vertical;background:#fcfcfe}
.toast{font-size:12.5px;color:#0a7a48}
.ph2{color:var(--ink3);font-size:14px;padding:34px;text-align:center}
.acctstrip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.acct{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--ink2)}
.acct small{color:var(--ink3);font-size:11px;font-weight:400}
.dot.off{background:var(--amber)}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2b{grid-template-columns:1fr}}
.wc-ok{display:flex;align-items:center;gap:12px}
.wc-ok .ic{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:flex;align-items:center;justify-content:center}
.wc-ok .ic.g{background:var(--green-s);color:#0a7a48}.wc-ok .ic svg{width:16px;height:16px}
.wc-ok b{font-size:14px}.wc-ok button{margin-left:auto}
.wc-qr{text-align:center;padding:6px 0}
.wc-qr img{width:230px;height:230px;background:#fff;border-radius:10px;padding:8px;border:1px solid var(--line)}
.steps2{text-align:left;max-width:250px;margin:12px auto 0;font-size:12.5px;color:var(--ink2);padding-left:18px}
.steps2 li{margin:4px 0}
.destbox{display:flex;flex-direction:column;gap:10px}
.dopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer}
.dopt.on{border-color:var(--acc);background:var(--acc-soft)}
.dopt input{margin-top:3px}
.dopt b{font-size:13.5px;display:block}.dopt small{font-size:12px;color:var(--ink3)}
.numin{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;color:var(--ink);width:100%}
.numin:disabled{background:#f4f5f9;color:var(--ink3)}
.destact{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.destact .toast{margin-right:auto}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.btn{font-size:13px;font-weight:600;padding:8px 15px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn:hover{border-color:rgba(28,28,28,.18)}.btn.p:hover{background:#36352f}.btn:disabled{opacity:.6;cursor:default}
</style>

/* Buttons Bebe support design: one palette, type scale and control language. */
:root {

@media(max-width:600px) {

const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const isEsc=t=>{const a=(t.action||"").toLowerCase(),p=(t.priority||"").toUpperCase();return a.includes("escal")||p==="IMMEDIATE"||p==="CRITICAL"||p==="HIGH";};
const keyOf=t=>String(t.message_id??t.ticket_id??"");
const ago=t=>{const d=t.processed_at||t.created_at;if(!d)return"";const s=(Date.now()-new Date(d).getTime())/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago";};
const digits=v=>{const a=String(v).split("");return `<span class="t-digit-group is-animating">${a.map((ch,i)=>`<span class="t-digit"${i===a.length-2?' data-stagger="1"':(i===a.length-1?' data-stagger="2"':'')}>${esc(ch)}</span>`).join("")}</span>`;};

async function jget(u){try{const r=await fetch(u,{cache:"no-store"});if(!r.ok)return null;return await r.json();}catch(e){return null;}}

function bindCompactHeader(){
 const wrap=document.querySelector(".wrap");
 const schedule=()=>{if(headerScrollFrame)return;headerScrollFrame=requestAnimationFrame(()=>{headerScrollFrame=0;const mobile=window.matchMedia("(max-width: 900px)").matches;const y=mobile?window.scrollY:(wrap?wrap.scrollTop:0);const next=headerCompact?y>12:y>36;if(next===headerCompact)return;headerCompact=next;const main=document.querySelector(".main");if(main)main.classList.toggle("header-compact",headerCompact);});};
 if(wrap)wrap.onscroll=schedule;window.onscroll=schedule;window.onresize=schedule;schedule();
}

async function boot(){
 const [s,t,lg,kh,nd,wd]=await Promise.all([jget(API+"/stats"),jget(API+"/tickets?limit=100"),jget(API+"/learning"),jget(KBAPI+"/health"),jget(API+"/notifications"),jget(WAAPI+"/status")]);
 loadErrors=[];if(s===null)loadErrors.push("stats");if(t===null)loadErrors.push("tickets");if(lg===null)loadErrors.push("learning");
 loadFailed=loadErrors.length>0;
 if(s!==null)stats=s;if(Array.isArray(t))tickets=t;if(lg!==null)learn=lg;
 if(kh!==null){kbHealth=kh;kbHealthError="";}else{kbHealth=null;kbHealthError="Knowledge-base health data is unavailable";}
 if(nd!==null){notificationData=nd;notificationError="";}else{notificationError="Live notifications are unavailable. Refresh to retry.";}
 if(wd!==null){waData=wd;waSig=wd.state+"|"+(wd.owner||"")+"|"+(wd.qr||"");}
 else{waData=null;waSig="";}
 if(!loadFailed)lastUpdated=new Date();statusMsg=loadFailed?"Could not load "+loadErrors.join(", ")+" data; showing last known values":"Dashboard data updated";
 startNotificationPoll();
 render();
}

function goTickets(nextFilter="all",ticketKey=null){filter=nextFilter;tab="tickets";openTk=ticketKey==null?null:String(ticketKey);render();if(openTk)requestAnimationFrame(()=>{const d=document.querySelector(".detail");if(d)d.focus();});}

function render(){
 const pages={overview:"Overview",tickets:"Ticket feed",conns:"Connections",kb:"Knowledge base",notices:"Notice Board",notif:"Notifications",settings:"Settings"};
 const subs={overview:"How your AI support agent is performing",tickets:"Every ticket, its AI draft, and what needs you",conns:"Your connected tools and their health",kb:"Edit what your agent knows — policies, FAQs, intents, tickets",notices:"Temporary store facts that take effect after review without bypassing safety rules",notif:"Link WhatsApp and choose where alerts go",settings:"Configure your agent"};
 const unreadCount=notificationData&&Number.isInteger(notificationData.unread_count)?notificationData.unread_count:null;
 const notificationLabel=unreadCount===null?"Open notifications — live status unavailable":`Open notifications — ${unreadCount} unread`;
 document.getElementById("app").innerHTML=`
  <aside class="side">

    <div class="store"><div class="av">B</div><div><div class="nm">Buttons Bebe</div><div class="pl">Hermes agent</div></div></div>

       <span class="freshness">${freshText()}</span>
       <div class="live" role="status"><span class="dot"></span> Agent live</div>
       <button class="head-icon refresh-control" id="refresh" aria-label="Refresh dashboard data" title="Refresh dashboard data">${IC.refresh}</button>
       <button class="head-icon" id="header-notif" aria-label="${notificationLabel}" title="${notificationLabel}">${IC.notif}${unreadCount===null?'':`<span class="t-badge" data-open="${unreadCount>0}"><span class="t-badge-dot">${unreadCount>99?'99+':unreadCount}</span></span>`}</button>

      </div></header>

  </div>`;
 const status=document.getElementById("app-status");if(status){status.textContent="";requestAnimationFrame(()=>{status.textContent=liveMessage();});}
 const openTab=k=>{tab=k;openTk=null;focusHeadingAfterRender=true;if(tab==="kb"&&!kbData){loadKb();}else if(tab==="notif"||tab==="conns"){render();loadNotifications();}else if(tab==="notices"){loadNotices();}else{render();}};
 document.querySelectorAll(".nav a[data-tab]").forEach(a=>{a.onclick=()=>openTab(a.dataset.tab);a.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openTab(a.dataset.tab);}};});
 const rf=document.getElementById("refresh");if(rf)rf.onclick=async()=>{rf.classList.add("refreshing");rf.disabled=true;statusMsg="Refreshing dashboard data";if(tab==="kb"){kbData=null;await loadKb();}else if(tab==="notif"){await loadNotifications();}else if(tab==="notices"){await loadNotices();}else{await boot();}};
 const hn=document.getElementById("header-notif");if(hn)hn.onclick=()=>openTab("notif");
 const hs=document.getElementById("header-settings");if(hs)hs.onclick=()=>openTab("settings");
 const lo=document.getElementById("header-logout");if(lo)lo.onclick=async()=>{lo.disabled=true;try{await fetch(API+"/auth/logout",{method:"POST",credentials:"same-origin"});}finally{location.replace("/console/login");}};
 const mb=document.getElementById("menu-btn"),side=document.querySelector(".side"),scrim=document.getElementById("nav-scrim");
 const setMenu=(open,restore=true)=>{if(!side||!scrim||!mb)return;side.classList.toggle("open",open);scrim.classList.toggle("open",open);mb.setAttribute("aria-expanded",String(open));if(open)requestAnimationFrame(()=>{const first=side.querySelector(".nav a");if(first)first.focus();});else if(restore)mb.focus();};
 if(mb)mb.onclick=()=>setMenu(!side.classList.contains("open"));if(scrim)scrim.onclick=()=>setMenu(false);

function view(){return tab==="overview"?overview():tab==="tickets"?ticketsView():tab==="conns"?conns():tab==="kb"?kbView():tab==="notices"?noticesView():tab==="notif"?notificationsView():settingsView();}
function errorBanner(){return `<div class="error-banner" role="alert"><div><strong>Could not load ${esc(loadErrors.join(", "))} data.</strong><span>Existing values are shown where available. Refresh to try again.</span></div><button class="btn" id="retry-load">Retry</button></div>`;}

function ownerAlertWarning(count){return Number(count)>0?`<div class="warn" role="alert">${Number(count)} owner alert${Number(count)===1?'':'s'} need review. WhatsApp acknowledgement or delivery is uncertain; inspect the affected ticket. No automatic resend was attempted.</div>`:"";}
function overview(){
 if(loadErrors.includes("stats")||loadErrors.includes("tickets"))return `<div class="panel" role="alert"><h3>Overview metrics are unavailable</h3><div class="ph">Refresh to retry. No missing values are being presented as zero.</div></div>${learnPanel()}`;
 const standardDrafts=stats.drafted||0,sensitiveDrafts=stats.sensitive_draft||0,noKbDrafts=stats.no_kb_match||0,legacyEscalated=stats.escalated||0;
 const drafted=standardDrafts+sensitiveDrafts+noKbDrafts,escalated=legacyEscalated+sensitiveDrafts,done=stats.done||0,failed=stats.failed||0;
 const handled=drafted+legacyEscalated,autor=handled?Math.round(drafted/handled*100):0;
 const queue=(stats.pending||0)+(stats.processing||0),currentEsc=tickets.filter(isEsc).length;
 const kpis=[
  {l:"Tickets processed",v:done,s:"all-time",up:true,f:"all"},
  {l:"AI drafts written",v:drafted,s:"ready for review",up:true,f:"draft"},
  {l:"Escalated to you",v:escalated,s:"sensitive only",up:false,f:"escalated"},
  {l:"Draft coverage",v:autor+"%",s:"drafted vs escalated",up:true,f:"draft"},
  {l:"Failed jobs",v:failed,s:failed?"needs a look":"all clear",up:!failed,dn:!!failed,f:"failed"},
  {l:"In queue",v:queue,s:"waiting / running",up:true,f:"queue"}
 ];
 const pr=[["Critical",stats.critical||0,"#f43f5e"],["High",stats.high||0,"#f9a16c"],["Normal",stats.normal||0,"#e7f65e"],["Low",stats.low||0,"#34d399"]];
 const mx=Math.max(1,...pr.map(x=>x[1]));const recent=tickets.slice(0,5);
 return `${ownerAlertWarning(stats.owner_alerts_need_attention)}<section class="attention" aria-labelledby="attention-title"><div class="attention-head"><h2 id="attention-title">Needs your attention</h2><p>Current work that may need a human</p></div><div class="attention-items">

  </div></section>
 <div class="kpis">${kpis.map(k=>`<button class="kpi" data-go-filter="${k.f}" aria-label="View ${esc(k.l)} tickets"><div class="l">${esc(k.l)}</div><div class="v">${digits(k.v)}</div><div class="s ${k.dn?'dn':(k.up?'up':'')}">${esc(k.s)}</div></button>`).join("")}</div>
 <div class="grid2">
  <div class="panel"><h3>Risk breakdown</h3><div class="ph">How your agent classified processed tickets</div>
   <div class="hb">${pr.map(p=>`<button class="r risk-link" data-go-filter="risk:${p[0].toLowerCase()}" aria-label="View ${p[0]} risk tickets"><div class="lab">${p[0]}</div><div class="track"><div class="fill" style="width:${Math.round(p[1]/mx*100)}%;background:${p[2]}"></div></div><div class="n">${p[1]}</div></button>`).join("")}</div></div>

   <div class="act">${recent.length?recent.map(t=>`<button class="r activity-link" data-go-ticket="${esc(keyOf(t))}"><div class="ic ${isEsc(t)?'a':'g'}">${isEsc(t)?'!':IC.check}</div><div><b>${esc(nameOf(t))}</b> - ${esc(t.ticket_subject||"(no subject)")}<br><small>${isEsc(t)?'Escalated to you':'AI drafted a reply'}</small></div><div class="tm">${ago(t)}</div></button>`).join(""):'<div class="hint">No tickets processed yet.</div>'}</div></div>
 </div>${learnPanel()}`;

function learnPanel(){
 if(loadErrors.includes("learning"))return `<div class="panel learning-panel" role="alert"><h3>Learning metrics are unavailable</h3><div class="ph">Refresh to retry. Existing totals have not been replaced with zeroes.</div></div>`;
 const lt=learn.total||0,un=learn.unchanged||0,ed=learn.edited||0,base=un+ed;
 const acc=base?Math.round(un/base*100):null;
 return `<div class="panel learning-panel"><div class="sec-title">Learning over time</div><h3>What the agent is learning</h3><div class="ph">Every reply you approve becomes an example the agent reuses — folded in automatically each night</div>
  <div class="lrow"><div class="lstat"><div class="v">${digits(lt)}</div><div class="l">Lessons captured</div></div>

function cleanDraft(s){return (s||"").replace(/^\s*\[SENSITIVE[^\]]*\]\s*/i,"").trim();}
function cleanMessage(raw){
 const full=(raw||"").replace(/\r/g,"").trim();
 const lines=full.split("\n");const keep=[];let quoted=false,cut=0;
 for(const ln of lines){
   const s=ln.trim();

   if(quoted){cut++;continue;}
   keep.push(ln);
 }
 let main=keep.join("\n");
 main=main.replace(/https?:\/\/\S*list-manage\.com\S*/gi,"[email-preferences link]");
 main=main.replace(/https?:\/\/\S{45,}/gi,m=>m.slice(0,42)+"…");
 main=main.replace(/\n{3,}/g,"\n\n").trim();
 return {main, hasMore: cut>0 || main.length < full.length};
}

function actionStorageKey(t,kind){return "bb-action-v1:"+kind+":"+t.ticket_id+":"+String(t.message_id);}
async function hashActionText(value){const bytes=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));return Array.from(new Uint8Array(bytes),x=>x.toString(16).padStart(2,"0")).join("");}
async function actionOperation(t,kind,text,approveLearning){
 const key=actionStorageKey(t,kind);
 const fingerprint=await hashActionText(JSON.stringify([text.trim(),String(t.message_id),t.draft_text||"",!!approveLearning]));
 const old=JSON.parse(localStorage.getItem(key)||"null");
 if(old&&old.fingerprint===fingerprint)return old.operation_id;
 if(old&&["unknown","pending"].includes(old.delivery_status))throw new Error("The previous action is unresolved. Check its status before sending different text.");
 const record={operation_id:crypto.randomUUID(),fingerprint,delivery_status:"unknown"};
 localStorage.setItem(key,JSON.stringify(record));
 return record.operation_id;
}
function rememberAction(t,kind,response){
 const key=actionStorageKey(t,kind),record=JSON.parse(localStorage.getItem(key)||"null");
 if(!record)return;
 if(response.operation_id)record.operation_id=response.operation_id;
 record.delivery_status=response.delivery_status||"unknown";
 localStorage.setItem(key,JSON.stringify(record));
}
function actionMessage(j){
 if(j.delivery_status==="sent")return "✅ Sent to the customer";
 if(j.delivery_status==="recorded")return "✅ Posted as an internal note in Gorgias";
 if(j.delivery_status==="not_attempted")return "No message was posted. Refresh the ticket: "+(j.error||"");
 if(j.delivery_status==="failed")return "Gorgias reports delivery failed. Inspect the message in Gorgias.";
 return j.message||("Delivery is not confirmed. Check action status before sending again."+(j.error?" ("+j.error+")":""));
}
async function submitAction(kind){
 if(actBusy)return;
 captureAct();const t=curTk();if(!t)return;
 if(!actDraft.trim()){actMsg="Nothing to send.";render();return;}
 const warn=isEsc(t)?"This ticket is flagged SENSITIVE.\n\n":"";
 const confirmation=kind==="send"?"Send this reply directly to "+(t.customer_email||"the customer")+"?":"Post this text as a staff-only internal note in Gorgias?";
 if(!confirm(warn+confirmation))return;
 const approvedText=actDraft,serverDraft=t.draft_text||"",learningApproval=kind==="send"&&actLearn,actionTicketKey=keyOf(t);
 let message="";
 actBusy=true;actMsg=kind==="send"?"Sending…":"Posting internal note…";render();
 try{
  const operation_id=await actionOperation(t,kind,approvedText,learningApproval);
  const draft_revision=await hashActionText(serverDraft);
  const meta={text:approvedText,confirmed:true,operation_id,source_message_id:String(t.message_id),draft_revision,approve_learning:learningApproval};
  const r=await fetch(API+"/ticket/"+t.ticket_id+"/"+kind,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(meta)});
  const j=await r.json();rememberAction(t,kind,j);message=actionMessage(j);
 }catch(e){message=e.message||"Delivery could not be confirmed. Check action status before sending again.";}

}

  ${notificationMsg?`<div class="notification-status">${esc(notificationMsg)}</div>`:''}
 </section><div class="sec-title">Alert delivery</div>${notificationDelivery()}`;
}
async function loadNotifications({renderNow=true}={}){
 const loadWhatsApp=tab==="notif"||tab==="conns";
 const [nextNotifications,nextWhatsApp]=await Promise.all([
  jget(API+"/notifications"),
  loadWhatsApp?jget(WAAPI+"/status"):Promise.resolve(null),
 ]);
 if(nextNotifications===null){notificationError="Live notifications are unavailable. Refresh to retry.";}
 else{notificationData=nextNotifications;notificationError="";}
 if(loadWhatsApp){
  if(nextWhatsApp!==null){
   const nextSig=nextWhatsApp.state+"|"+(nextWhatsApp.owner||"")+"|"+(nextWhatsApp.qr||"");
   if(nextSig!==waSig){captureWaForm();waData=nextWhatsApp;waSig=nextSig;}
  }else{waData=null;waSig="";}
 }
 if(renderNow&&(tab==="notif"||tab==="conns"))render();
}
function startNotificationPoll(){
 if(notificationPoll)clearTimeout(notificationPoll);
 const poll=async()=>{
  if(!document.hidden)await loadNotifications({renderNow:tab==="notif"||tab==="conns"});
  notificationPoll=setTimeout(poll,15000);
 };
 notificationPoll=setTimeout(poll,15000);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadNotifications({renderNow:tab==="notif"||tab==="conns"});});
async function markNotificationsRead(ids,all=false){
 if(!notificationData)return false;
 notificationBusy=true;notificationMsg="Marking notifications read…";render();
 try{
  const r=await fetch(API+"/notifications/read",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(all?{all:true}:{ids})});
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||"request failed");
  const marked=new Set(all?notificationData.notifications.map(notification=>notification.id):ids);
  notificationData.notifications.forEach(notification=>{if(marked.has(notification.id))notification.read=true;});
  notificationData.unread_count=data.unread_count;
  notificationMsg=all?"All current notifications marked read.":"Notification marked read.";
  return true;
 }catch(e){notificationMsg="Could not update notification state.";return false;
 }finally{notificationBusy=false;}
}
async function openDashboardNotification(index){
 const notification=notificationData&&notificationData.notifications&&notificationData.notifications[index];
 if(!notification)return;
 if(!notification.read)await markNotificationsRead([notification.id]);
 const freshTickets=await jget(API+"/tickets?limit=100");
 if(Array.isArray(freshTickets))tickets=freshTickets;
 goTickets(notification.filter||"all",notification.message_id);
}
async function saveWa(){
 captureWaForm();waMsg="Saving…";render();
 try{const r=await fetch(WAAPI+"/notify",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({mode:waMode,number:waNumber})});const j=await r.json();waMsg=r.ok?"Saved ✓":(j.error||"Save failed");}catch(e){waMsg="Save failed";}
 render();
}
async function testWa(){
 captureWaForm();waMsg="Sending test…";render();
 try{const r=await fetch(WAAPI+"/test",{method:"POST"});const j=await r.json();waMsg=r.ok?("Test sent to "+waNum(j.to)):(j.error||"Could not send");}catch(e){waMsg="Could not send";}
 render();
}
async function unlinkWa(){
 if(!confirm("Unlink this WhatsApp? You'll need to scan a new QR to receive alerts again."))return;
 waMsg="Unlinking…";render();
 try{await fetch(WAAPI+"/logout",{method:"POST"});}catch(e){}
 waMsg="Unlinked — scan the new QR below to re-link.";waSig="";setTimeout(loadNotifications,1500);render();
}
function localDateTimeValue(date){const p=n=>String(n).padStart(2,"0");return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`;}
function defaultNoticeDeadline(){return localDateTimeValue(new Date(Date.now()+24*60*60*1000));}
function fmtWhen(iso){try{return new Date(iso).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return iso;}}
function noticeTimezone(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"local time";}catch(e){return"local time";}}
function captureNoticeForm(){const ta=document.getElementById("nb-text"),wi=document.getElementById("nb-when");if(ta)noticeText=ta.value;if(wi)noticeDeadline=wi.value;}
function focusNotice(id){requestAnimationFrame(()=>{const el=document.getElementById(id);if(el)el.focus();});}
function validateNoticeDraft(){
 const text=noticeText.trim();
 if(!text)return{ok:false,error:"Write the override before reviewing it.",field:"nb-text"};
 if(text.length>NOTICE_TEXT_MAX)return{ok:false,error:`Keep the override to ${NOTICE_TEXT_MAX.toLocaleString()} characters or fewer.`,field:"nb-text"};
 if(noticeNoExpiry)return{ok:true,text,expires_at:null};
 if(!noticeDeadline)return{ok:false,error:"Choose when this override should expire, or explicitly select no expiry.",field:"nb-when"};
 const deadline=new Date(noticeDeadline);
 if(isNaN(deadline.getTime())||deadline.getTime()<=Date.now()+60*1000)return{ok:false,error:"Choose an expiry at least one minute in the future.",field:"nb-when"};
 return{ok:true,text,expires_at:deadline.toISOString()};
}
function noticeCard(n){
 const active=!!n.active,when=n.expires_at?(active?`Expires ${fmtWhen(n.expires_at)}`:`Expired ${fmtWhen(n.expires_at)}`):"No expiry — manual removal required";
 const published=n.created_at?`Published ${fmtWhen(n.created_at)} by ${n.created_by||"owner"}`:`Published by ${n.created_by||"owner"}`;
 const ending=noticeDeletingId===n.id,confirming=noticeRemoveId===n.id;
 const shortText=String(n.text||"").replace(/\s+/g," ").slice(0,72);
 const actions=active?`<div class="notice-card-actions"><button class="btn notice-danger" type="button" data-prepare-del="${esc(n.id)}" aria-label="End live notice: ${esc(shortText)}">End notice</button></div>`:`<div class="notice-card-actions"><button class="btn" type="button" data-reuse-notice="${esc(n.id)}" aria-label="Use expired notice again: ${esc(shortText)}">Use again</button></div>`;
 const confirm=confirming?`<div class="notice-remove-confirm" role="alert"><div><strong>End this notice now?</strong><span>The agent will immediately return to its normal knowledge-base answers.</span></div><div class="notice-remove-actions"><button class="btn" id="nb-cancel-remove" type="button" data-cancel-del>Cancel</button><button class="btn notice-danger" type="button" data-confirm-del="${esc(n.id)}" ${ending?'disabled':''}>${ending?'Ending…':'End notice'}</button></div></div>`:"";
 return `<li><article class="panel notice-card" aria-label="${active?'Live':'Expired'} owner override"><div><div class="notice-card-copy">${esc(n.text)}</div><div class="notice-card-meta"><span class="notice-badge ${active?'live':'expired'}">${active?'Live':'Expired'}</span><span>Applies globally</span><span>${esc(when)}</span><span>${esc(published)}</span></div></div>${actions}${confirm}</article></li>`;
}
function noticesView(){
 const loadWarning=noticesError?`<div class="error-banner" role="alert"><div><strong>Notice Board status is unavailable.</strong><span>${esc(noticesError)} Active overrides may still exist, so publishing is disabled until the list loads.</span></div><button class="btn" id="retry-notices" type="button">Retry</button></div>`:"";
 if(noticesError&&!noticesData)return loadWarning;
 if(!noticesData)return '<div class="notice-loading" aria-label="Loading Notice Board"><div class="notice-skeleton"></div><div class="notice-skeleton"></div></div>';
 const list=noticesData.notices||[],live=list.filter(n=>n.active),gone=list.filter(n=>!n.active),tz=noticeTimezone();
 const review=noticeReview?(()=>{const valid=validateNoticeDraft();if(!valid.ok)return"";const conflictItems=live.slice(0,3).map(n=>`<li>${esc(n.text.slice(0,140))}${n.text.length>140?'…':''}</li>`).join("");return `<section class="notice-review" aria-labelledby="nb-review-title"><div class="notice-review-head"><div><h2 id="nb-review-title" tabindex="-1">Review before publishing</h2><p>This becomes active immediately and overrides conflicting policies, FAQs, and product details. It cannot change safety rules or send a reply.</p></div><span class="notice-badge">Final check</span></div><div class="notice-review-copy">${esc(valid.text)}</div><div class="notice-meta"><span>Applies globally</span><span>${valid.expires_at?`Expires ${esc(fmtWhen(valid.expires_at))}`:"No expiry — manual removal"}</span><span>${esc(tz)}</span></div>${live.length?`<div class="notice-conflicts" role="note"><strong>${live.length} other live notice${live.length===1?'':'s'} — check for conflicts.</strong>${conflictItems?`<ul>${conflictItems}</ul>`:""}</div>`:""}<div class="notice-review-actions"><button class="btn" id="nb-back" type="button">Back to edit</button><button class="btn p" id="nb-publish" type="button" ${noticeBusy?'disabled':''}>${noticeBusy?'Publishing…':'Publish override'}</button></div></section>`;})():"";
 return `${loadWarning}<section class="panel notice-compose" aria-labelledby="notice-compose-title"><div class="notice-intro"><div><h2 id="notice-compose-title">Create an owner override</h2><p>Use this for a temporary fact the agent must follow across every customer question. You will review the exact wording and duration before it goes live.</p></div><div class="notice-safety"><strong>Facts only</strong>Notices can override knowledge-base content, but they never change sensitive-ticket handling, the human review gate, or the rule that the agent cannot send replies.</div></div><form id="nb-form" class="notice-form" novalidate><div class="notice-field"><label class="notice-label" for="nb-text">What should the agent treat as true? <span class="notice-required" aria-hidden="true">*</span></label><textarea id="nb-text" class="notice-textarea" required maxlength="${NOTICE_TEXT_MAX}" spellcheck="true" aria-describedby="nb-text-help nb-count nb-feedback" aria-invalid="${noticeErrorField==='nb-text'}" placeholder="Example: Orders placed from Friday through Sunday ship on Monday with free standard delivery.">${esc(noticeText)}</textarea><div class="notice-help-row"><span id="nb-text-help">Write one clear fact. Include dates, products, regions, or exceptions in the wording.</span><span class="notice-count" id="nb-count">${noticeText.length.toLocaleString()} / ${NOTICE_TEXT_MAX.toLocaleString()}</span></div></div><fieldset class="notice-duration"><legend>When should it stop?</legend><div class="notice-duration-grid"><label class="notice-choice ${noticeNoExpiry?'':'selected'}" for="nb-expiry-time"><input id="nb-expiry-time" type="radio" name="nb-expiry" value="time" ${noticeNoExpiry?'':'checked'} ${noticesError?'disabled':''}><span class="notice-choice-copy"><strong>Expire automatically</strong><span>Recommended for temporary shipping, availability, and promotion updates.</span><input class="notice-input" type="datetime-local" id="nb-when" value="${esc(noticeDeadline)}" min="${esc(localDateTimeValue(new Date(Date.now()+60*1000)))}" aria-label="Override expiry date and time" aria-describedby="nb-timezone nb-feedback" aria-invalid="${noticeErrorField==='nb-when'}" ${noticeNoExpiry||noticesError?'disabled':''}></span></label><label class="notice-choice ${noticeNoExpiry?'selected':''}" for="nb-expiry-none"><input id="nb-expiry-none" type="radio" name="nb-expiry" value="none" ${noticeNoExpiry?'checked':''} ${noticesError?'disabled':''}><span class="notice-choice-copy"><strong>No expiry</strong><span>Choose deliberately. The override stays live until someone ends it.</span></span></label></div><div class="notice-help-row"><span id="nb-timezone">Times use ${esc(tz)}.</span><span>Publishing takes effect instantly; no re-index is needed.</span></div></fieldset><div class="notice-actions"><div id="nb-feedback" class="notice-feedback ${noticeError?'error':''}" ${noticeError?'role="alert"':''}>${esc(noticeError||noticeMsg)}</div><button class="btn p" id="nb-review" type="submit" ${noticesError||noticeBusy||!noticeText.trim()?'disabled':''}>Review notice</button></div></form></section>${review}<section aria-labelledby="live-notices-title"><div class="notice-section-title"><h2 class="sec-title" id="live-notices-title">Live notices${live.length?' ('+live.length+')':''}</h2><span>Newest notices appear last</span></div>${live.length?`<ul class="notice-list">${live.map(noticeCard).join("")}</ul>`:`<div class="panel notice-empty"><div class="notice-empty-icon">${IC.notices}</div><div><strong>No owner overrides are live</strong><span>The agent is answering from its normal knowledge base. Create an override only when a temporary fact must take precedence.</span></div></div>`}</section>${gone.length?`<section aria-labelledby="expired-notices-title"><div class="notice-section-title"><h2 class="sec-title" id="expired-notices-title">Recently expired</h2><span>Available until automatic cleanup</span></div><ul class="notice-list">${gone.map(noticeCard).join("")}</ul></section>`:""}`;
}
async function loadNotices(){
 const previous=noticesData;noticesError="";if(!previous){noticesData=null;render();}
 const data=await jget(KBAPI+"/notices");
 if(data===null){noticesError="We could not verify the current notice list.";noticesData=previous;noticeReview=false;}
 else{noticesData=data;noticesError="";}
 render();
}
function reviewNotice(){
 captureNoticeForm();noticeMsg="";noticeError="";noticeErrorField="";
 const valid=validateNoticeDraft();
 if(!valid.ok){noticeReview=false;noticeError=valid.error;noticeErrorField=valid.field;render();focusNotice(valid.field);return;}
 noticeReview=true;render();focusNotice("nb-review-title");
}
async function postNotice(){
 if(!noticeReview||noticeBusy||noticesError)return;
 const valid=validateNoticeDraft();
 if(!valid.ok){noticeReview=false;noticeError=valid.error;noticeErrorField=valid.field;render();focusNotice(valid.field);return;}
 noticeBusy=true;noticeMsg="";noticeError="";render();
 try{
  const r=await fetch(KBAPI+"/notices",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:valid.text,expires_at:valid.expires_at})});
  let j={};try{j=await r.json();}catch(e){}
  if(r.ok){noticeText="";noticeDeadline=defaultNoticeDeadline();noticeNoExpiry=false;noticeReview=false;noticeMsg="Override published. The agent uses it now.";const refreshed=await jget(KBAPI+"/notices");if(refreshed===null){noticesData=null;noticesError="The override was published, but we could not reload the current list.";}else{noticesData=refreshed;noticesError="";}}
  else{noticeError="Could not publish: "+(j.error||r.status);}
 }catch(e){noticeError="Could not publish the override. Check the connection and try again.";}
 noticeBusy=false;render();
}
function requestNoticeRemoval(id){noticeRemoveId=id;noticeError="";noticeMsg="";render();focusNotice("nb-cancel-remove");}
async function deleteNotice(id){
 if(noticeDeletingId)return;noticeDeletingId=id;noticeError="";render();
 try{
  const r=await fetch(KBAPI+"/notices/delete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id})});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error(j.error||String(r.status));
  noticeRemoveId=null;noticeMsg="Notice ended. The agent has returned to its normal answers.";const refreshed=await jget(KBAPI+"/notices");if(refreshed===null){noticesData=null;noticesError="The notice ended, but we could not reload the current list.";}else{noticesData=refreshed;noticesError="";}
 }catch(e){noticeError="Could not end the notice: "+(e.message||"try again");}
 noticeDeletingId=null;render();
}
function reuseNotice(id){const n=(noticesData&&noticesData.notices||[]).find(x=>String(x.id)===String(id));if(!n)return;noticeText=n.text||"";noticeDeadline=defaultNoticeDeadline();noticeNoExpiry=false;noticeReview=false;noticeMsg="Copied into a new draft. Review the wording and expiry.";noticeError="";render();focusNotice("nb-text");}
function bind(){
 document.querySelectorAll("[data-go-filter]").forEach(b=>b.onclick=()=>goTickets(b.dataset.goFilter));
 document.querySelectorAll("[data-go-ticket]").forEach(b=>b.onclick=()=>goTickets("all",b.dataset.goTicket));
 const retry=document.getElementById("retry-load");if(retry)retry.onclick=boot;
 const retryNotifications=document.getElementById("retry-notifications");if(retryNotifications)retryNotifications.onclick=()=>loadNotifications();
 const markAllNotifications=document.getElementById("mark-all-notifications");if(markAllNotifications)markAllNotifications.onclick=async()=>{await markNotificationsRead([],true);render();};
 document.querySelectorAll("[data-notification-index]").forEach(button=>button.onclick=()=>openDashboardNotification(Number(button.dataset.notificationIndex)));
 document.querySelectorAll(".chip[data-f]").forEach(c=>c.onclick=()=>{filter=c.dataset.f;openTk=null;render();});
 document.querySelectorAll(".row[data-tk]").forEach(r=>{r.onclick=()=>{if(openTk===String(r.dataset.tk)){openTk=null;render();}else{openTicket(r.dataset.tk);}};r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();r.click();}};});
 const as=document.getElementById("act-send");if(as)as.onclick=sendReply;
 const an=document.getElementById("act-note");if(an)an.onclick=noteReply;
 const ast=document.getElementById("act-status");if(ast)ast.onclick=checkActionStatus;
 const ae=document.getElementById("act-edit");if(ae)ae.onclick=()=>{captureAct();actEditOpen=!actEditOpen;render();};
 const ar=document.getElementById("act-rewrite");if(ar)ar.onclick=rewriteDraft;
 const acx=document.getElementById("act-canceledit");if(acx)acx.onclick=()=>{captureAct();actEditOpen=false;render();};
 const arw=document.getElementById("act-raw");if(arw)arw.onclick=()=>{captureAct();actShowRaw=!actShowRaw;render();};
 document.querySelectorAll(".kbitem[data-open]").forEach(b=>b.onclick=e=>{e.stopPropagation();openKbFile(b.dataset.open);});
 document.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>newKbFile(b.dataset.new));
 const ks=document.getElementById("kb-save");if(ks)ks.onclick=saveKb;
 const kretry=document.getElementById("kb-retry-file");if(kretry)kretry.onclick=()=>openKbFile(kbSel);
 const kr=document.getElementById("kb-reindex");if(kr)kr.onclick=reindexKb;
 const ws=document.getElementById("wa-save");if(ws)ws.onclick=saveWa;
 const wt=document.getElementById("wa-test");if(wt)wt.onclick=testWa;
 const wu=document.getElementById("wa-unlink");if(wu)wu.onclick=unlinkWa;
 document.querySelectorAll('input[name=wamode]').forEach(r=>r.onchange=()=>{captureWaForm();render();});
 const nr=document.getElementById("retry-notices");if(nr)nr.onclick=loadNotices;
 const nf=document.getElementById("nb-form");if(nf)nf.onsubmit=e=>{e.preventDefault();reviewNotice();};
 const nt=document.getElementById("nb-text");if(nt)nt.oninput=()=>{noticeText=nt.value;noticeReview=false;noticeError="";noticeErrorField="";const count=document.getElementById("nb-count"),review=document.getElementById("nb-review"),feedback=document.getElementById("nb-feedback"),preview=document.querySelector(".notice-review");if(count)count.textContent=`${noticeText.length.toLocaleString()} / ${NOTICE_TEXT_MAX.toLocaleString()}`;if(review)review.disabled=!noticeText.trim();if(feedback){feedback.textContent="";feedback.classList.remove("error");}nt.setAttribute("aria-invalid","false");if(preview)preview.remove();};
 const nw=document.getElementById("nb-when");if(nw)nw.oninput=()=>{noticeDeadline=nw.value;noticeReview=false;noticeError="";noticeErrorField="";const feedback=document.getElementById("nb-feedback"),preview=document.querySelector(".notice-review");if(feedback){feedback.textContent="";feedback.classList.remove("error");}nw.setAttribute("aria-invalid","false");if(preview)preview.remove();};
 document.querySelectorAll('input[name="nb-expiry"]').forEach(r=>r.onchange=()=>{captureNoticeForm();noticeNoExpiry=r.value==="none";if(!noticeNoExpiry&&!noticeDeadline)noticeDeadline=defaultNoticeDeadline();noticeReview=false;noticeError="";noticeErrorField="";render();focusNotice(r.id);});
 const nb=document.getElementById("nb-back");if(nb)nb.onclick=()=>{noticeReview=false;render();focusNotice("nb-text");};
 const np=document.getElementById("nb-publish");if(np)np.onclick=postNotice;
 document.querySelectorAll("[data-prepare-del]").forEach(b=>b.onclick=()=>requestNoticeRemoval(b.dataset.prepareDel));
 document.querySelectorAll("[data-cancel-del]").forEach(b=>b.onclick=()=>{noticeRemoveId=null;render();});
 document.querySelectorAll("[data-confirm-del]").forEach(b=>b.onclick=()=>deleteNotice(b.dataset.confirmDel));
 document.querySelectorAll("[data-reuse-notice]").forEach(b=>b.onclick=()=>reuseNotice(b.dataset.reuseNotice));
}
boot();
</script>
