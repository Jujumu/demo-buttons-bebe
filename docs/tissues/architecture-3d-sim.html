<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buttons Bebe — Walk inside the organs</title>
  <style>
    :root {
      --ink: #1c1916;
      --paper: #fffdf9;
      --warm: #f5f0e8;
      --line: #d6d3d1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--warm); color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
    #canvas-host { position: absolute; inset: 0; }
    #canvas-host canvas { display: block; width: 100%; height: 100%; }

    .hud {
      position: absolute; z-index: 4; pointer-events: none;
      top: 18px; left: 18px; width: min(380px, calc(100vw - 36px));
    }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; pointer-events: auto; }
    .toolbar button.is-on { background: var(--ink); color: var(--paper); }
    .card {
      pointer-events: auto;
      background: rgba(255, 253, 249, 0.94);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 16px 14px;
      box-shadow: 0 16px 40px rgba(28, 25, 22, 0.12);
      backdrop-filter: blur(10px);
    }
    .card.is-off { display: none; }
    .crumb { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #78716c; margin-bottom: 6px; }
    h1 { font-size: 20px; line-height: 1.2; margin-bottom: 6px; }
    .lede { font-size: 14px; line-height: 1.45; color: #44403c; }
    .meta { margin-top: 10px; font-size: 12px; line-height: 1.45; color: #57534e; }
    .meta code {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px; background: #f5efe6; padding: 1px 5px; border-radius: 4px;
    }
    .wire-key { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .wire-key span { display: flex; align-items: center; gap: 8px; }
    .wire-ico { width: 34px; height: 10px; flex-shrink: 0; }
    .row { display: none; }
    button {
      pointer-events: auto;
      border: 1.5px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: var(--ink); color: var(--paper); }
    button:hover { filter: brightness(0.96); }
    button:disabled { opacity: 0.35; cursor: default; }

    #hint {
      position: absolute; z-index: 4; right: 18px; bottom: 18px;
      background: rgba(28, 25, 22, 0.88); color: #fff;
      font-size: 12px; padding: 8px 12px; border-radius: 8px;
      pointer-events: none;
    }
    #boot-error {
      display: none; position: absolute; inset: 18px auto auto 18px; z-index: 8;
      max-width: 420px; background: #1c1916; color: #fff; padding: 14px 16px;
      border-radius: 12px; font-size: 14px; line-height: 1.4;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="canvas-host"></div>
  <div class="hud">
    <div class="toolbar">
      <button id="btn-info" aria-pressed="false">Info</button>
      <button id="btn-back" disabled>← Back out</button>
      <button id="btn-reset">Reset camera</button>
    </div>
    <div class="card is-off" id="info-card">
      <div class="crumb" id="crumb">Whole body</div>
      <h1 id="title">Click an organ to walk inside</h1>
      <p class="lede" id="lede">Big blocks are organs. Little parts inside are tissues — each one has a single job.</p>
      <div class="meta" id="meta"></div>
    </div>
  </div>
  <div id="hint">Drag to look around · scroll to zoom · click a shape</div>
  <div id="boot-error"></div>
  <script src="./vendor/gsap.min.js"></script>
  <script type="module" src="./architecture-world.js"></script>
</body>
</html>
