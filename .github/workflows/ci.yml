name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The classifier parity gate loads the pre-split implementation from
          # local history; a one-commit checkout would silently remove it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared Python environments
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kb/requirements.txt -r tools/requirements.txt
          python -m pip install -e processor -e webhook
      - name: Install ripgrep (required by the release gate)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Run offline release gate
        env:
          PYTHON: python
          PROCESSOR_PYTHON: python
        run: bash tools/verify_release.sh

  whatsapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: whatsapp-connect/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buyer env file without live credentials
        run: cp .env.example .env
      - name: Build inbox image without secrets
        run: docker compose build
      - name: Image must not contain a baked .env
        run: docker compose run --rm --no-deps --entrypoint test inbox ! -f /app/.env
      - name: Smoke inbox without live Shopify credentials
        run: |
          set -euo pipefail
          docker compose up -d --no-build
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/health >/tmp/inbox-health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = "1"
          grep -q '"ok": true' /tmp/inbox-health.json
          curl -fsS -o /dev/null http://127.0.0.1:8766/index.html
          docker compose down
